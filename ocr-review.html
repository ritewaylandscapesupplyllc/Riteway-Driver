<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riteway OCR Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #050608;
      --bg-elevated: #15191f;
      --accent: #12C3A0;
      --accent-soft: rgba(18,195,160,0.18);
      --text: #f5f7fb;
      --text-muted: #a6afb8;
      --border-subtle: #252c35;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.55);
      --radius-lg: 18px;
      --radius-pill: 999px;
      --danger: #ff7979;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #151a20 0, #050608 55%, #020203 100%);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-x: hidden;
    }

    .header-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 140px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(0,0,0,0.7));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.86rem;
      color: var(--accent);
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-badge {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-soft);
      background: rgba(5, 8, 11, 0.86);
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      gap: 14px;
      align-items: stretch;
      min-height: 0;
    }

    @media (max-width: 980px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(0,0,0,0.78));
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
      padding: 14px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .pill {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(5, 8, 11, 0.9);
      white-space: nowrap;
    }

    .field-input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: rgba(5, 8, 11, 0.95);
      padding: 7px 10px;
      font-size: 0.8rem;
      color: var(--text);
      outline: none;
      margin-bottom: 8px;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .ticket-list {
      max-height: 44vh;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(6, 9, 13, 0.95);
      padding: 6px;
    }

    .pit-chart {
      max-height: 28vh;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(6, 9, 13, 0.95);
      padding: 6px;
      margin-bottom: 10px;
    }

    .pit-row {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      background: rgba(255,255,255,0.01);
    }

    .pit-row:hover,
    .pit-row.active {
      border-color: rgba(18,195,160,0.5);
      background: rgba(18,195,160,0.1);
    }

    .pit-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 0.75rem;
    }

    .pit-name {
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pit-tons {
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      font-size: 0.72rem;
    }

    .pit-bar {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 4px;
    }

    .pit-bar-fill {
      height: 100%;
      background: linear-gradient(135deg, var(--accent), #12e1b5);
      border-radius: 999px;
      min-width: 2px;
    }

    .pit-meta {
      font-size: 0.69rem;
      color: var(--text-muted);
    }

    .ticket-row {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .ticket-row:hover,
    .ticket-row.active {
      border-color: rgba(18,195,160,0.5);
      background: rgba(18,195,160,0.1);
    }

    .ticket-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
    }

    .ticket-id {
      color: var(--accent);
      font-weight: 600;
    }

    .ticket-meta {
      font-size: 0.73rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 18px 10px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 10px;
    }

    @media (max-width: 760px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }
    }

    .image-wrap {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: #050608;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-wrap img {
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      display: block;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .editor-grid .full {
      grid-column: 1 / -1;
    }

    .field-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .field-edit {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(5, 8, 11, 0.95);
      padding: 7px 8px;
      font-size: 0.78rem;
      color: var(--text);
      outline: none;
    }

    .field-edit:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn-outline,
    .btn-accent {
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      padding: 7px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-outline {
      border: 1px solid var(--border-subtle);
      background: rgba(5,8,11,0.9);
      color: var(--text-muted);
    }

    .btn-accent {
      border: none;
      background: linear-gradient(135deg, var(--accent), #12e1b5);
      color: #031210;
      font-weight: 600;
    }

    .status {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 6px;
      min-height: 1.1em;
    }

    .toggle-group {
      display: inline-flex;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(5, 8, 11, 0.9);
    }

    .toggle-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: rgba(18,195,160,0.2);
      color: var(--text);
    }

    .filter-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .report-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .hamburger-btn {
      width: 38px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(5,8,11,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-right: 8px;
    }

    .hamburger-inner {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger-line {
      height: 2px;
      border-radius: 999px;
      background: var(--text);
    }

    .side-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .side-menu-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      max-width: 80vw;
      height: 100%;
      background: rgba(5,8,11,0.98);
      border-right: 1px solid var(--border-subtle);
      box-shadow: 12px 0 30px rgba(0,0,0,0.7);
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.24s ease;
      display: flex;
      flex-direction: column;
      padding: 14px 14px 16px;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .side-menu-logo {
      width: 130px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
    }

    .side-menu-close {
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    .side-menu-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .side-menu-item {
      width: 100%;
      text-align: left;
      border-radius: 999px;
      padding: 9px 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,14,18,0.96);
      color: var(--text);
      font-size: 0.84rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-menu-item span.label {
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.75rem;
    }

    .side-menu-item span.chevron {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .side-menu-item.active {
      border-color: rgba(18,195,160,0.7);
      background: rgba(18,195,160,0.16);
    }
  </style>
</head>
<body>
  <div id="sideMenuBackdrop" class="side-menu-backdrop" onclick="closeMenu()"></div>
  <div id="sideMenu" class="side-menu">
    <div class="side-menu-header">
      <img src="riteway-logo.png" alt="Riteway Logo" class="side-menu-logo">
      <button class="side-menu-close" onclick="closeMenu()">✕</button>
    </div>
    <div class="side-menu-title">Dispatch Menu</div>

    <button class="side-menu-item" onclick="goToPage('dispatch.html')">
      <span class="label">Dashboard Home</span>
      <span class="chevron">›</span>
    </button>

    <button class="side-menu-item" onclick="goToPage('invite-driver.html')">
      <span class="label">Invite New Driver</span>
      <span class="chevron">›</span>
    </button>

    <button class="side-menu-item" onclick="goToPage('drivers.html')">
      <span class="label">View All Drivers</span>
      <span class="chevron">›</span>
    </button>

    <button class="side-menu-item" onclick="goToPage('scale-tickets.html')">
      <span class="label">Scale Ticket Viewer</span>
      <span class="chevron">›</span>
    </button>

    <button class="side-menu-item active" onclick="goToPage('ocr-review.html')">
      <span class="label">OCR Review</span>
      <span class="chevron">›</span>
    </button>
  </div>

  <div class="header-row">
    <div class="header-left">
      <button class="hamburger-btn" onclick="toggleMenu()">
        <div class="hamburger-inner">
          <div class="hamburger-line"></div>
          <div class="hamburger-line"></div>
          <div class="hamburger-line"></div>
        </div>
      </button>
      <img src="riteway-logo.png" alt="Riteway Logo" class="brand-logo">
      <div class="brand-text">
        <div class="brand-title">Riteway Dispatch</div>
        <div class="brand-subtitle">OCR Review & Correction</div>
      </div>
    </div>
    <div class="header-badge" id="metaBadge">0 OCR Records</div>
  </div>

  <div class="app-shell">
    <div class="card">
      <div class="section-title-row">
        <div class="section-title">Pit Tonnage</div>
        <div class="pill" id="pitCount">0 pits</div>
      </div>
      <div class="report-actions">
        <button class="btn-outline" id="printReportBtn">Print Report</button>
      </div>
      <input id="searchInput" class="field-input" placeholder="Search by ticket, delivery, pit, material...">
      <div id="pitChart" class="pit-chart"></div>
      <div class="section-title-row" style="margin-top:2px;">
        <div class="section-title" id="listTitle">Needs Review</div>
        <div class="toggle-group">
          <button id="needsOnlyBtn" class="toggle-btn active">Needs Review</button>
          <button id="allRecordsBtn" class="toggle-btn">All Records</button>
        </div>
        <div class="pill" id="listCount">0</div>
      </div>
      <div class="filter-hint" id="filterHint">Pit filter: All Pits</div>
      <div id="ticketList" class="ticket-list"></div>
    </div>

    <div class="card">
      <div class="section-title-row">
        <div class="section-title">Edit OCR Fields</div>
        <div class="pill" id="selectedLabel">No selection</div>
      </div>
      <div class="editor-layout">
        <div class="image-wrap">
          <img id="ticketImage" alt="Scale ticket" style="display:none;">
          <div id="imagePlaceholder" class="empty-state">Select a record to view and edit.</div>
        </div>

        <div>
          <div class="editor-grid">
            <div>
              <div class="field-label">Ticket #</div>
              <input id="editTicketNumber" class="field-edit">
            </div>
            <div>
              <div class="field-label">Date</div>
              <input id="editDate" class="field-edit">
            </div>
            <div>
              <div class="field-label">Gross</div>
              <input id="editGross" class="field-edit">
            </div>
            <div>
              <div class="field-label">Tare</div>
              <input id="editTare" class="field-edit">
            </div>
            <div>
              <div class="field-label">Net</div>
              <input id="editNet" class="field-edit">
            </div>
            <div>
              <div class="field-label">Net Tons</div>
              <input id="editNetTons" class="field-edit" type="number" step="0.01">
            </div>
            <div class="full">
              <div class="field-label">Pit</div>
              <input id="editPit" class="field-edit">
            </div>
            <div class="full">
              <div class="field-label">Material</div>
              <input id="editMaterial" class="field-edit">
            </div>
          </div>
          <div class="actions">
            <button class="btn-outline" id="openImageBtn">Open Full Size</button>
            <button class="btn-accent" id="saveBtn">Save OCR Edits</button>
          </div>
          <div id="saveStatus" class="status"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TICKETS_REF_PATH = 'scaleTicketsMetadata';

    const firebaseConfig = {
      apiKey: "AIzaSyDmyq_bxVHipY5UxZY-28sXUu0-fJvL69I",
      authDomain: "ritewaytracking-3e9d0.firebaseapp.com",
      databaseURL: "https://ritewaytracking-3e9d0-default-rtdb.firebaseio.com",
      projectId: "ritewaytracking-3e9d0",
      storageBucket: "ritewaytracking-3e9d0.firebasestorage.app",
      messagingSenderId: "817275576166",
      appId: "1:817275576166:web:56a92bcaf8f60d52a0b2a7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let allRecords = [];
    let filteredRecords = [];
    let selectedRecordId = '';
    let selectedPit = 'all';
    let showNeedsOnly = true;

    function openMenu() {
      document.getElementById('sideMenu').classList.add('open');
      document.getElementById('sideMenuBackdrop').classList.add('open');
    }

    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('sideMenuBackdrop').classList.remove('open');
    }

    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      if (menu.classList.contains('open')) closeMenu(); else openMenu();
    }

    function goToPage(path) {
      window.location.href = path;
    }

    function parseUploadedTime(uploadedAt) {
      if (!uploadedAt) return null;
      if (typeof uploadedAt === 'number') {
        return uploadedAt < 1e12 ? uploadedAt * 1000 : uploadedAt;
      }
      const t = Date.parse(uploadedAt);
      return isNaN(t) ? null : t;
    }

    function formatShortDate(uploadedAt) {
      const ts = parseUploadedTime(uploadedAt);
      if (!ts) return 'Unknown';
      const d = new Date(ts);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function currentFields(rec) {
      return (rec.ocr && rec.ocr.fields) || {};
    }

    function normalizeValue(v) {
      return String(v == null ? '' : v).trim().toLowerCase();
    }

    function isMissingValue(v) {
      const clean = normalizeValue(v);
      return !clean || clean === 'unknown' || clean === 'unknown pit' || clean === 'unknown product' || clean === 'n/a' || clean === 'na' || clean === '-' || clean === '—';
    }

    function getPitName(rec) {
      const pit = normalizeValue(currentFields(rec).pit);
      return pit ? currentFields(rec).pit.trim() : 'Unknown Pit';
    }

    function getNetTons(rec) {
      const n = Number(currentFields(rec).netTons);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function getMaterialName(rec) {
      const material = normalizeValue(currentFields(rec).material);
      return material ? currentFields(rec).material.trim() : 'Unknown Material';
    }

    function getMissingFields(rec) {
      const f = currentFields(rec);
      const missing = [];
      if (isMissingValue(f.pit)) missing.push('pit');
      if (isMissingValue(f.material)) missing.push('material');
      if (!Number.isFinite(Number(f.netTons)) || Number(f.netTons) <= 0) missing.push('net tons');
      return missing;
    }

    function needsReview(rec) {
      return getMissingFields(rec).length > 0;
    }

    function setModeButtons() {
      const needsBtn = document.getElementById('needsOnlyBtn');
      const allBtn = document.getElementById('allRecordsBtn');
      const title = document.getElementById('listTitle');
      if (!needsBtn || !allBtn || !title) return;
      if (showNeedsOnly) {
        needsBtn.classList.add('active');
        allBtn.classList.remove('active');
        title.textContent = 'Needs Review';
      } else {
        allBtn.classList.add('active');
        needsBtn.classList.remove('active');
        title.textContent = 'Records';
      }
    }

    function updateFilterHint() {
      const hint = document.getElementById('filterHint');
      if (!hint) return;
      const pitText = selectedPit === 'all' ? 'All Pits' : selectedPit;
      const modeText = showNeedsOnly ? 'Needs Review Only' : 'All Records';
      hint.textContent = 'Pit filter: ' + pitText + ' · ' + modeText;
    }

    function listenForRecords() {
      db.ref(TICKETS_REF_PATH).on('value', snapshot => {
        const val = snapshot.val() || {};
        const arr = [];
        Object.entries(val).forEach(([id, data]) => {
          const rec = {
            id,
            ticketId: data.ticketId || id,
            deliveryId: data.deliveryId || data.delivery_id || '',
            imageUrl: data.downloadUrl || data.imageUrl || data.url || '',
            uploadedAt: data.createdAtISO || data.createdAt || null,
            ocr: data.ocr || null
          };
          if (rec.ocr) arr.push(rec);
        });

        arr.sort((a, b) => (parseUploadedTime(b.uploadedAt) || 0) - (parseUploadedTime(a.uploadedAt) || 0));
        allRecords = arr;
        const needsCount = arr.filter(needsReview).length;
        document.getElementById('metaBadge').textContent = arr.length + ' OCR · ' + needsCount + ' Need Review';
        renderPitSummary();
        applySearch();
      });
    }

    function applySearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      filteredRecords = allRecords.filter(rec => {
        if (showNeedsOnly && !needsReview(rec)) return false;
        if (selectedPit !== 'all' && getPitName(rec) !== selectedPit) return false;
        const f = currentFields(rec);
        const haystack = [
          rec.id,
          rec.ticketId,
          rec.deliveryId,
          f.pit,
          f.material,
          f.ticketNumber
        ].join(' ').toLowerCase();
        return !q || haystack.includes(q);
      });
      updateFilterHint();
      renderNeedsReviewList();

      if (!filteredRecords.some(r => r.id === selectedRecordId)) {
        if (filteredRecords.length) {
          fillEditor(filteredRecords[0], true);
        } else {
          clearEditor();
        }
      }
    }

    function renderPitSummary() {
      const chart = document.getElementById('pitChart');
      const pitCountEl = document.getElementById('pitCount');
      chart.innerHTML = '';

      const aggregate = {};
      allRecords.forEach(rec => {
        const pit = getPitName(rec);
        if (!aggregate[pit]) {
          aggregate[pit] = { pit, tons: 0, loads: 0, needs: 0 };
        }
        aggregate[pit].loads += 1;
        aggregate[pit].tons += getNetTons(rec);
        if (needsReview(rec)) aggregate[pit].needs += 1;
      });

      const rows = Object.values(aggregate).sort((a, b) => a.pit.localeCompare(b.pit));
      pitCountEl.textContent = rows.length + (rows.length === 1 ? ' pit' : ' pits');

      const maxTons = rows.reduce((m, r) => Math.max(m, r.tons), 0) || 1;

      const allRow = document.createElement('div');
      allRow.className = 'pit-row' + (selectedPit === 'all' ? ' active' : '');
      allRow.innerHTML = `
        <div class="pit-top">
          <span class="pit-name">All Pits</span>
          <span class="pit-tons">${rows.reduce((s, r) => s + r.tons, 0).toFixed(2)} tons</span>
        </div>
        <div class="pit-meta">${allRecords.length} OCR records</div>
      `;
      allRow.addEventListener('click', () => {
        selectedPit = 'all';
        renderPitSummary();
        applySearch();
      });
      chart.appendChild(allRow);

      if (!rows.length) {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.textContent = 'No OCR records found.';
        chart.appendChild(div);
        return;
      }

      rows.forEach(r => {
        const pct = Math.max(2, Math.round((r.tons / maxTons) * 100));
        const row = document.createElement('div');
        row.className = 'pit-row' + (selectedPit === r.pit ? ' active' : '');
        row.innerHTML = `
          <div class="pit-top">
            <span class="pit-name">${r.pit}</span>
            <span class="pit-tons">${r.tons.toFixed(2)} tons</span>
          </div>
          <div class="pit-bar"><div class="pit-bar-fill" style="width:${pct}%;"></div></div>
          <div class="pit-meta">${r.loads} loads · ${r.needs} need review</div>
        `;
        row.addEventListener('click', () => {
          selectedPit = r.pit;
          renderPitSummary();
          applySearch();
        });
        chart.appendChild(row);
      });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getReportSourceRecords() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return allRecords.filter(rec => {
        if (selectedPit !== 'all' && getPitName(rec) !== selectedPit) return false;
        const f = currentFields(rec);
        const haystack = [
          rec.id,
          rec.ticketId,
          rec.deliveryId,
          f.pit,
          f.material,
          f.ticketNumber
        ].join(' ').toLowerCase();
        return !q || haystack.includes(q);
      });
    }

    function buildPrintableReportHtml(records) {
      const pitAgg = {};
      const materialAgg = {};

      records.forEach(rec => {
        const pit = getPitName(rec);
        const material = getMaterialName(rec);
        const tons = getNetTons(rec);

        if (!pitAgg[pit]) pitAgg[pit] = { name: pit, tons: 0, loads: 0 };
        pitAgg[pit].tons += tons;
        pitAgg[pit].loads += 1;

        if (!materialAgg[material]) materialAgg[material] = { name: material, tons: 0, loads: 0 };
        materialAgg[material].tons += tons;
        materialAgg[material].loads += 1;
      });

      const pitRows = Object.values(pitAgg).sort((a, b) => b.tons - a.tons || a.name.localeCompare(b.name));
      const materialRows = Object.values(materialAgg).sort((a, b) => b.tons - a.tons || a.name.localeCompare(b.name));

      const totalLoads = records.length;
      const totalTons = pitRows.reduce((sum, r) => sum + r.tons, 0);
      const maxPit = pitRows.reduce((m, r) => Math.max(m, r.tons), 0) || 1;
      const maxMaterial = materialRows.reduce((m, r) => Math.max(m, r.tons), 0) || 1;

      const pitGraphHtml = pitRows.map(r => {
        const pct = Math.max(2, Math.round((r.tons / maxPit) * 100));
        return `
          <div class="bar-row">
            <div class="bar-label">${escapeHtml(r.name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
            <div class="bar-value">${r.tons.toFixed(2)} t</div>
          </div>
        `;
      }).join('');

      const materialGraphHtml = materialRows.map(r => {
        const pct = Math.max(2, Math.round((r.tons / maxMaterial) * 100));
        return `
          <div class="bar-row">
            <div class="bar-label">${escapeHtml(r.name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
            <div class="bar-value">${r.tons.toFixed(2)} t</div>
          </div>
        `;
      }).join('');

      const pitTableHtml = pitRows.map(r => `
        <tr>
          <td>${escapeHtml(r.name)}</td>
          <td>${r.tons.toFixed(2)}</td>
          <td>${r.loads}</td>
        </tr>
      `).join('');

      const materialTableHtml = materialRows.map(r => `
        <tr>
          <td>${escapeHtml(r.name)}</td>
          <td>${r.tons.toFixed(2)}</td>
          <td>${r.loads}</td>
        </tr>
      `).join('');

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riteway Tonnage Report</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; color:#0f1720; margin:24px; }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:130px; height:auto; }
    .title { font-size:20px; font-weight:700; margin:0; }
    .subtitle { margin:2px 0 0; font-size:12px; color:#475569; }
    .meta { text-align:right; font-size:12px; color:#475569; }
    .kpis { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px; margin-bottom:12px; }
    .kpi { border:1px solid #d4dbe5; border-radius:10px; padding:8px 10px; }
    .kpi-label { font-size:11px; color:#475569; text-transform:uppercase; letter-spacing:.06em; }
    .kpi-value { font-size:18px; font-weight:700; margin-top:2px; }
    .section { margin-top:12px; border:1px solid #d4dbe5; border-radius:12px; padding:10px; }
    .section h2 { margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:#334155; }
    .bar-row { display:grid; grid-template-columns: 220px 1fr 72px; gap:8px; align-items:center; margin-bottom:6px; }
    .bar-label { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-track { background:#e6edf5; border-radius:999px; overflow:hidden; height:10px; }
    .bar-fill { height:100%; background: linear-gradient(135deg, #12C3A0, #12e1b5); }
    .bar-value { font-size:12px; text-align:right; font-weight:700; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    th, td { border-bottom:1px solid #e6edf5; padding:6px 4px; text-align:left; }
    th { text-transform:uppercase; font-size:10px; letter-spacing:.08em; color:#475569; }
    .footer { margin-top:10px; font-size:11px; color:#64748b; }
    @media print { body { margin:12mm; } .section { break-inside: avoid; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="riteway-logo.png" alt="Riteway Logo" class="logo">
      <div>
        <h1 class="title">Riteway Materials Report</h1>
        <p class="subtitle">Pit and material tonnage summary</p>
      </div>
    </div>
    <div class="meta">
      <div>Generated: ${escapeHtml(new Date().toLocaleString())}</div>
      <div>Pit filter: ${escapeHtml(selectedPit === 'all' ? 'All Pits' : selectedPit)}</div>
      <div>Search filter: ${escapeHtml(document.getElementById('searchInput').value.trim() || 'None')}</div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Total Loads</div><div class="kpi-value">${totalLoads}</div></div>
    <div class="kpi"><div class="kpi-label">Total Tons</div><div class="kpi-value">${totalTons.toFixed(2)}</div></div>
    <div class="kpi"><div class="kpi-label">Pits Included</div><div class="kpi-value">${pitRows.length}</div></div>
  </div>

  <div class="section">
    <h2>Tonnage By Pit</h2>
    ${pitGraphHtml || '<div class="subtitle">No data.</div>'}
    <table>
      <thead><tr><th>Pit</th><th>Tons</th><th>Loads</th></tr></thead>
      <tbody>${pitTableHtml}</tbody>
    </table>
  </div>

  <div class="section">
    <h2>Material Quantities</h2>
    ${materialGraphHtml || '<div class="subtitle">No data.</div>'}
    <table>
      <thead><tr><th>Material</th><th>Tons</th><th>Loads</th></tr></thead>
      <tbody>${materialTableHtml}</tbody>
    </table>
  </div>

  <div class="footer">Riteway Dispatch OCR Report</div>
</body>
</html>`;
    }

    function printTonnageReport() {
      const records = getReportSourceRecords();
      if (!records.length) {
        const status = document.getElementById('saveStatus');
        if (status) status.textContent = 'No data to print for current filters.';
        return;
      }

      const html = buildPrintableReportHtml(records);
      const win = window.open('', '_blank', 'noopener,noreferrer,width=1200,height=900');
      if (!win) {
        const status = document.getElementById('saveStatus');
        if (status) status.textContent = 'Popup blocked. Allow popups to print report.';
        return;
      }
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(() => win.print(), 350);
    }

    function renderNeedsReviewList() {
      const el = document.getElementById('ticketList');
      el.innerHTML = '';
      document.getElementById('listCount').textContent = String(filteredRecords.length);

      if (!filteredRecords.length) {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.textContent = selectedPit === 'all'
          ? 'No OCR records need review.'
          : 'No records need review for this pit.';
        el.appendChild(div);
        return;
      }

      filteredRecords.forEach(rec => {
        const f = currentFields(rec);
        const missing = getMissingFields(rec);
        const row = document.createElement('div');
        row.className = 'ticket-row' + (rec.id === selectedRecordId ? ' active' : '');
        row.innerHTML = `
          <div class="ticket-row-top">
            <span class="ticket-id">${rec.ticketId || rec.id}</span>
            <span class="ticket-meta">${formatShortDate(rec.uploadedAt)}</span>
          </div>
          <div class="ticket-meta">Delivery: ${rec.deliveryId || '—'}</div>
          <div class="ticket-meta">Pit: ${f.pit || '—'}</div>
          <div class="ticket-meta">Material: ${f.material || '—'}</div>
          <div class="ticket-meta" style="color:${missing.length ? '#ffb3b3' : 'var(--text-muted)'};">
            ${missing.length ? ('Missing: ' + missing.join(', ')) : 'Complete'}
          </div>
        `;
        row.addEventListener('click', () => fillEditor(rec, true));
        el.appendChild(row);
      });
    }

    function setField(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value == null ? '' : String(value);
    }

    function clearEditor() {
      selectedRecordId = '';
      document.getElementById('selectedLabel').textContent = 'No selection';
      setField('editTicketNumber', '');
      setField('editDate', '');
      setField('editGross', '');
      setField('editTare', '');
      setField('editNet', '');
      setField('editNetTons', '');
      setField('editPit', '');
      setField('editMaterial', '');
      document.getElementById('saveStatus').textContent = '';

      const img = document.getElementById('ticketImage');
      const ph = document.getElementById('imagePlaceholder');
      img.removeAttribute('src');
      img.style.display = 'none';
      ph.style.display = 'block';
      document.getElementById('openImageBtn').onclick = null;

      renderNeedsReviewList();
    }

    function fillEditor(rec, rerenderList) {
      selectedRecordId = rec.id;
      const fields = currentFields(rec);
      document.getElementById('selectedLabel').textContent = rec.ticketId || rec.id;

      setField('editTicketNumber', fields.ticketNumber || '');
      setField('editDate', fields.date || '');
      setField('editGross', fields.gross || '');
      setField('editTare', fields.tare || '');
      setField('editNet', fields.net || '');
      setField('editNetTons', fields.netTons == null ? '' : fields.netTons);
      setField('editPit', fields.pit || '');
      setField('editMaterial', fields.material || '');

      const img = document.getElementById('ticketImage');
      const ph = document.getElementById('imagePlaceholder');
      if (rec.imageUrl) {
        img.src = rec.imageUrl;
        img.style.display = 'block';
        ph.style.display = 'none';
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
        ph.style.display = 'block';
      }

      document.getElementById('openImageBtn').onclick = () => {
        if (rec.imageUrl) window.open(rec.imageUrl, '_blank');
      };

      if (rerenderList) renderNeedsReviewList();
    }

    async function saveEdits() {
      if (!selectedRecordId) return;
      const status = document.getElementById('saveStatus');
      status.textContent = 'Saving...';

      const payload = {
        fields: {
          ticketNumber: document.getElementById('editTicketNumber').value.trim(),
          date: document.getElementById('editDate').value.trim(),
          gross: document.getElementById('editGross').value.trim(),
          tare: document.getElementById('editTare').value.trim(),
          net: document.getElementById('editNet').value.trim(),
          netTons: (() => {
            const v = document.getElementById('editNetTons').value;
            if (v === '') return null;
            const n = Number(v);
            return Number.isFinite(n) ? Number(n.toFixed(2)) : null;
          })(),
          pit: document.getElementById('editPit').value.trim(),
          material: document.getElementById('editMaterial').value.trim()
        },
        editedAt: new Date().toISOString(),
        editedBy: 'dispatch-ops'
      };

      try {
        await db.ref(TICKETS_REF_PATH + '/' + selectedRecordId + '/ocr').update(payload);
        status.textContent = 'Saved at ' + new Date().toLocaleTimeString();
      } catch (err) {
        console.error('Save failed', err);
        status.textContent = 'Save failed. See console.';
      }
    }

    window.addEventListener('load', () => {
      setModeButtons();
      updateFilterHint();
      listenForRecords();
      document.getElementById('searchInput').addEventListener('input', applySearch);
      document.getElementById('saveBtn').addEventListener('click', saveEdits);
      document.getElementById('printReportBtn').addEventListener('click', printTonnageReport);
      document.getElementById('needsOnlyBtn').addEventListener('click', () => {
        showNeedsOnly = true;
        setModeButtons();
        applySearch();
      });
      document.getElementById('allRecordsBtn').addEventListener('click', () => {
        showNeedsOnly = false;
        setModeButtons();
        applySearch();
      });
      document.addEventListener('keydown', (e) => {
        const isSave = (e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's';
        if (!isSave) return;
        e.preventDefault();
        if (selectedRecordId) saveEdits();
      });
    });
  </script>
</body>
</html>
